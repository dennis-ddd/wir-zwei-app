<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6FA"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wir zwei"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Wir zwei</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FA;--card:#fff;--ink:#1B1E2B;--mute:#5B6172;--line:#E3E6EE;--line2:#D5D8E1;
--a:#2F5BD8;--at:#E5ECFC;--ai:#1E3A8A;--b:#B9470B;--bt:#FCEBDD;--bi:#7C2D07;
--ok:#157347;--okt:#DFF3E8;--oki:#0F5132;--warn:#8A3A00;--warnt:#FFF1D6;--danger:#A61B1B;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.view{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 20px) 16px calc(var(--safe-b) + 104px);display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{font-size:13px;color:var(--mute);font-weight:600}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}
h2{margin:0;font-size:16px;font-weight:700}
.label{margin:6px 0 0;font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--a);font-weight:700;font-size:14px;padding:6px 0;min-height:36px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.icon.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{height:52px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.danger{background:var(--card);color:var(--danger);border:1px solid #E3B4B4}
.btn.big{height:60px;font-size:16px;border-radius:18px}
.muted{color:var(--mute);font-size:13px}
.av{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.av-p1{background:var(--a)}.av-p2{background:var(--b)}.av.lg{width:36px;height:36px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.pill.ok{background:var(--okt);color:var(--oki)}.pill.warn{background:var(--warnt);color:var(--warn)}.pill.mute{background:#E9EBF1;color:var(--mute)}
.new{font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px;letter-spacing:.3px}
input.f,select.f,textarea.f{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:0 14px;font-size:16px}
textarea.f{height:72px;padding:12px 14px;resize:none}
.fl{display:flex;flex-direction:column;gap:6px}.fl>label,.fl>.lab{font-size:13px;font-weight:700;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#E9EBF1;padding:4px;border-radius:14px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{height:44px;border-radius:11px;border:0;background:transparent;color:var(--mute);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:14px}
.chip[aria-pressed=true]{background:var(--sel,var(--ink));border-color:var(--sel,var(--ink));color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{height:40px;padding:0 14px;border-radius:999px;font-size:13px}
/* Heute */
.shiftrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.shiftrow.p1{background:var(--at);color:var(--ai)}.shiftrow.p2{background:var(--bt);color:var(--bi)}
.shiftrow.none{background:#F0F1F5;color:var(--mute)}
.shiftrow b{display:block;font-size:14px}.shiftrow small{font-size:12px;font-weight:600}
.tile{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left}
.tile .num{font-size:26px;font-weight:800;line-height:1.1}.tile .t{font-size:17px;font-weight:800;line-height:1.25}
.status{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;border-radius:14px;padding:10px 12px;border:0;text-align:left;width:100%}
.status.ok{background:var(--okt);color:var(--oki)}.status.local{background:#E9EBF1;color:var(--mute)}.status.off{background:var(--warnt);color:var(--warn)}
.status i{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}
/* Dienste */
.wk{display:flex;gap:6px;align-items:center}.wk span{font-size:13px;font-weight:700;min-width:58px;text-align:center}
.dgrid{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch}
.dhead{font-size:12px;font-weight:700;color:var(--mute);padding:0 6px}
.dhead span{display:inline-flex;gap:6px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.day{padding:6px;border-radius:16px}.day.today{background:var(--card);box-shadow:0 0 0 2px var(--ink) inset}.day.both{background:#EAF7EF}
.dl{display:flex;flex-direction:column;justify-content:center}.dl small{font-size:12px;font-weight:600;color:var(--mute)}.dl b{font-size:18px;font-weight:800}
.cell{border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:48px;border:0;text-align:left;width:100%}
.cell b{font-size:13px}.cell small{font-size:11px;font-weight:600}
.cell.p1{background:var(--at);color:var(--ai)}.cell.p2{background:var(--bt);color:var(--bi)}
.cell.free{background:var(--card);color:var(--mute);border:1px dashed #B9BDC9}
.cell.empty{background:transparent;border:1px dashed var(--line2);color:var(--mute);align-items:center;font-size:20px}
.bothtag{margin:8px 0 0 56px}
/* Listen */
.list{background:var(--card);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:54px;padding:4px 8px 4px 14px;border-bottom:1px solid #F0F1F5}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:8px 0;min-height:46px}
.item .txt{flex:1;min-width:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.item .sub{display:block;font-size:12px;color:var(--mute);font-weight:600}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #9AA0B0;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.done .box{background:var(--ok);border-color:var(--ok)}.done .txt{color:var(--mute);text-decoration:line-through}
.x{width:40px;height:40px;border:0;background:none;color:var(--mute);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
.empty-hint{background:var(--card);border-radius:16px;padding:18px;color:var(--mute);font-size:14px;text-align:center}
.ev{background:var(--card);border-radius:18px;padding:14px;display:flex;gap:14px;border:0;text-align:left;width:100%}
.cal{width:52px;height:60px;border-radius:14px;background:#F0F1F5;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.cal small{font-size:11px;font-weight:700;color:var(--mute)}.cal b{font-size:20px;font-weight:800;line-height:1.1}
.ev .body{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.ev .ttl{font-size:16px;font-weight:700}
.conf{font-size:12px;font-weight:700;color:var(--warn);background:var(--warnt);padding:6px 8px;border-radius:8px}
.okline{font-size:12px;font-weight:700;color:var(--oki)}
.freebox{background:var(--okt);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--oki)}
.freebox .chip{border-color:var(--ok);color:var(--oki);background:#fff}
.logday{font-size:12px;font-weight:800;color:var(--mute);padding:10px 14px 2px;text-transform:uppercase;letter-spacing:.5px}
.logitem{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;min-height:50px}
.logitem .txt{flex:1;font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}.logitem .txt small{display:block;font-size:12px;color:var(--mute)}
.logitem time{font-size:12px;color:var(--mute);font-weight:700}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(var(--safe-b) + 8px);z-index:10}
nav.tabs button{border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;min-width:52px;flex:1;max-width:80px;min-height:52px;justify-content:center;position:relative}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:800}
nav.tabs button[aria-current=page] svg{stroke-width:2.3}
.badge{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--b);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,17,26,.45)}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 18px calc(var(--safe-b) + 20px);display:flex;flex-direction:column;gap:16px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:#C9CCD6;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}.ph h2{font-size:20px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}.actions.one{grid-template-columns:1fr}
.setup{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
.setup .view{padding-bottom:40px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 12px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.help{font-size:13px;color:var(--mute);line-height:1.5;margin:0}.help code{background:#E9EBF1;padding:1px 5px;border-radius:5px;font-size:12px}
details.card summary{font-weight:700;cursor:pointer}
.score{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border-radius:16px;padding:10px}
.score b{font-size:22px;font-weight:800;min-width:24px;text-align:center}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-size:15px;font-weight:600;text-align:left;color:var(--ink)}
.qopt:disabled{cursor:default;opacity:1}
.qopt.mine{border:2px solid var(--ink)}
.qopt.right{background:var(--okt);border-color:var(--ok);color:var(--oki)}
.qopt.wrong{background:#FDECEC;border-color:#E3B4B4;color:var(--danger)}
.qopt .marks{display:flex;gap:4px}
.res{font-size:12px;font-weight:800;border-radius:8px;padding:3px 7px}.res.y{background:var(--okt);color:var(--oki)}.res.n{background:#FDECEC;color:var(--danger)}
.drawcard{background:var(--card);border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center}
.drawimg{width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line);padding:0;background:#fff;flex-shrink:0}
.drawimg img{width:100%;height:100%;display:block}
.drawcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wordbox{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wordbox b{font-size:24px;font-weight:800}
.drawcv{display:block;margin:0 auto;border-radius:16px;background:#fff;border:1px solid var(--line2);touch-action:none}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line2);padding:0}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.bigimg{width:100%;max-width:420px;align-self:center;border-radius:16px;border:1px solid var(--line2);background:#fff;display:block}
.wheelwrap{position:relative;display:flex;justify-content:center;padding-top:6px}
.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--ink);z-index:2}
.wheelres{text-align:center;font-size:26px;font-weight:800;min-height:36px}
.wheelmini{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:conic-gradient(#2F5BD8 0 25%,#B9470B 0 50%,#157347 0 75%,#7B1FA2 0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<!-- ========== HEUTE ========== -->
<main class="view" id="v-heute" data-view="heute">
  <div class="top">
    <div><div class="kicker" id="h-date"></div><h1 id="h-hello">Hallo</h1></div>
    <button class="icon" id="btn-settings" aria-label="Einstellungen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div id="h-status"></div>
  <div id="h-body"></div>
</main>

<!-- ========== DIENSTE ========== -->
<main class="view" id="v-dienste" data-view="dienste" hidden>
  <div class="top">
    <h1>Dienstplan</h1>
    <div class="wk">
      <button class="icon" id="wk-prev" aria-label="Vorherige Woche"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span id="wk-label"></span>
      <button class="icon" id="wk-next" aria-label="Nächste Woche"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </div>
  <div id="d-week"></div>
  <button class="link" id="wk-today" style="align-self:center">Zur aktuellen Woche</button>
  <button class="btn" id="d-add"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Dienst eintragen</button>
</main>

<!-- ========== EINKAUF ========== -->
<main class="view" id="v-einkauf" data-view="einkauf" hidden>
  <div class="top"><h1>Einkaufsliste</h1><span class="kicker" id="s-count"></span></div>
  <form class="addrow" id="shop-form" autocomplete="off">
    <label for="shop-in" class="sr">Artikel hinzufügen</label>
    <input class="f" id="shop-in" placeholder="Artikel hinzufügen …" enterkeyhint="done">
    <button class="icon dark" style="width:48px;height:48px;border-radius:14px" aria-label="Hinzufügen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </form>
  <div id="s-list"></div>
</main>

<!-- ========== EVENTS ========== -->
<main class="view" id="v-events" data-view="events" hidden>
  <div class="top"><h1>Events</h1><button class="icon dark" id="e-add" aria-label="Event hinzufügen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div id="e-free"></div>
  <div id="e-list"></div>
</main>

<!-- ========== HAUSHALT ========== -->
<main class="view" id="v-haushalt" data-view="haushalt" hidden>
  <h1>Haushalt</h1>
  <button class="btn big" id="log-add"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Ich habe etwas erledigt</button>
  <p class="label">Muss gemacht werden</p>
  <form class="addrow" id="todo-form" autocomplete="off">
    <label for="todo-in" class="sr">Aufgabe eintragen</label>
    <input class="f" id="todo-in" placeholder="Aufgabe eintragen …" enterkeyhint="done">
    <button class="icon dark" style="width:48px;height:48px;border-radius:14px" aria-label="Aufgabe hinzufügen"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </form>
  <div id="t-list"></div>
  <p class="label">Erledigt</p>
  <div id="l-list"></div>
</main>

<!-- ========== SPIELE ========== -->
<main class="view" id="v-spiele" data-view="spiele" hidden>
  <h1>Spiele</h1>
  <div class="seg three" id="g-seg"><button type="button" data-g="quiz">Quiz</button><button type="button" data-g="malen">Malen</button><button type="button" data-g="rad">Glücksrad</button></div>
  <div id="g-body" style="display:flex;flex-direction:column;gap:14px"></div>
</main>

<nav class="tabs" aria-label="Hauptmenü">
  <button data-tab="heute" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Heute</button>

<script>
"use strict";
var APP_VERSION = "1.3 · 18.11.2026";
/* Eure Datenbank. Neue App-Installationen verbinden sich automatisch damit. */
var DEFAULT_DB = "https://theresdennis-default-rtdb.europe-west1.firebasedatabase.app";
var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
var LS = {
  get: function (k, d) { try { var v = localStorage.getItem("wz_" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set: function (k, v) { try { localStorage.setItem("wz_" + k, JSON.stringify(v)); } catch (e) {} }
};
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function rid(n) { var a = "abcdefghijkmnpqrstuvwxyz23456789", s = ""; var r = new Uint8Array(n || 12); (window.crypto || window.msCrypto).getRandomValues(r); for (var i = 0; i < r.length; i++) s += a[r[i] % a.length]; return s; }
var ICON_X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';

/* ---------- Zustand ---------- */
var cfg = LS.get("cfg", {});          // {me, url, code}
var tree = LS.get("tree", {});        // gemeinsame Daten
var queue = LS.get("queue", []);      // noch nicht gesendete Änderungen
var seen = LS.get("seen", {});        // zuletzt angesehen je Bereich
var lastTimes = LS.get("times", {});  // zuletzt benutzte Uhrzeiten je Person+Dienstart
var viewSince = {};
var tab = "heute";
var weekOffset = 0;
var online = "local";                 // local | ok | off
var gotInitial = false;

function save() { LS.set("tree", tree); LS.set("queue", queue); LS.set("cfg", cfg); }
function me() { return cfg.me || "p1"; }
function other(p) { return (p || me()) === "p1" ? "p2" : "p1"; }
function person(p) { var x = (tree.people || {})[p]; return { name: (x && x.name) || (p === "p1" ? "Person 1" : "Person 2") }; }
function nm(p) { return p === me() ? "Du" : person(p).name; }
function von(p) { return p === me() ? "dir" : person(p).name; }
function av(p, lg) { return '<span class="av av-' + p + (lg ? " lg" : "") + '" aria-hidden="true">' + esc(person(p).name.charAt(0).toUpperCase()) + "</span>"; }
function coll(k) { return tree[k] || {}; }
function entries(k) { var o = coll(k); return Object.keys(o).map(function (id) { var v = o[id]; v = Object.assign({}, v); v.id = id; return v; }); }

function setAt(obj, parts, val) {
  if (!parts.length) return val;
  var o = obj;
  for (var i = 0; i < parts.length - 1; i++) {
    if (typeof o[parts[i]] !== "object" || o[parts[i]] === null) { if (val === null) return obj; o[parts[i]] = {}; }
    o = o[parts[i]];
  }
  var last = parts[parts.length - 1];
  if (val === null || val === undefined) delete o[last]; else o[last] = val;
  return obj;
}
function splitPath(p) { return String(p).split("/").filter(Boolean); }

/* ---------- Schreiben + Sync (Firebase Realtime Database über REST) ---------- */
function synced() { return !!(cfg.url && cfg.code); }
function dbUrl(path) { return cfg.url.replace(/\/+$/, "") + "/paare/" + cfg.code + (path ? "/" + path : "") + ".json"; }
function write(path, val) {
  tree = setAt(tree, splitPath(path), val === undefined ? null : val);
  if (synced()) { queue.push({ p: path, d: val === undefined ? null : val }); flush(); }
  save(); render();
}
var flushing = false, retryT = null;
function flush() {
  if (!synced() || flushing || !queue.length) { updateStatus(); return; }
  flushing = true;
  var op = queue[0];
  fetch(dbUrl(op.p), { method: op.d === null ? "DELETE" : "PUT", body: op.d === null ? undefined : JSON.stringify(op.d) })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); queue.shift(); LS.set("queue", queue); flushing = false; flush(); })
    .catch(function () { flushing = false; online = "off"; updateStatus(); clearTimeout(retryT); retryT = setTimeout(flush, 8000); });
}
window.addEventListener("online", function () { flush(); connect(); });

var es = null;
function connect() {
  if (es) { try { es.close(); } catch (e) {} es = null; }
  if (!synced() || typeof EventSource === "undefined") { online = synced() ? "off" : "local"; updateStatus(); return; }
  gotInitial = false;
  try { es = new EventSource(dbUrl("")); } catch (e) { online = "off"; updateStatus(); return; }
  es.onopen = function () { online = "ok"; updateStatus(); flush(); };
  es.onerror = function () { online = "off"; updateStatus(); };
  es.addEventListener("put", function (e) { var m = JSON.parse(e.data); applyRemote([[m.path, m.data]]); });
  es.addEventListener("patch", function (e) { var m = JSON.parse(e.data), ops = []; Object.keys(m.data || {}).forEach(function (k) { ops.push([m.path.replace(/\/$/, "") + "/" + k, m.data[k]]); }); applyRemote(ops); });
  es.addEventListener("cancel", function () { online = "off"; updateStatus(); });
}
function snapshotKeys() {
  var ds = {}; Object.keys(drawColl()).forEach(function (k) { ds[k] = drawColl()[k].status; });
  var wl = wheelLast();
  return { log: Object.keys(coll("log")), shop: Object.keys(coll("shop")), events: Object.keys(coll("events")), draw: ds, wheelAt: wl ? wl.at : 0, quizOther: !!quizDay(iso(today()))[other()] };
}
function applyRemote(ops) {
  var before = snapshotKeys();
  ops.forEach(function (o) {
    if (o[0] === "/" || o[0] === "") tree = o[1] || {};
    else tree = setAt(tree, splitPath(o[0]), o[1]);
  });
  queue.forEach(function (q) { tree = setAt(tree, splitPath(q.p), q.d); });
  online = "ok";
  if (gotInitial) notifyNew(before);
  gotInitial = true;
  save(); render();
}
function notifyNew(before) {
  var msgs = [];
  [["log", function (v) { return person(v.by).name + ": " + v.title + " erledigt"; }],
   ["shop", function (v) { return person(v.by).name + " hat „" + v.name + "“ auf die Einkaufsliste gesetzt"; }],
   ["events", function (v) { return person(v.by).name + " hat ein Event eingetragen: " + v.title; }]].forEach(function (d) {
    entries(d[0]).forEach(function (v) { if (before[d[0]].indexOf(v.id) < 0 && v.by && v.by !== me()) msgs.push(d[1](v)); });
  });
  var o = person(other()).name;
  Object.keys(drawColl()).forEach(function (k) { var d = drawColl()[k]; if (!(k in before.draw) && d.by !== me()) msgs.push(o + " hat etwas gemalt. Rate mal!"); else if (before.draw[k] === "open" && d.status === "solved" && d.by === me()) msgs.push(o + " hat dein Bild erraten: „" + d.word + "“"); });
  var wl = wheelLast();
  if (wl && wl.at !== before.wheelAt && wl.by !== me()) { msgs.push(o + " hat am Glücksrad gedreht: " + wl.result); if (wheelState && wheelState.id === wl.listId && !$("#sheet").hidden) spinTo(wl.idx, wl.at); }
  if (!before.quizOther && quizDay(iso(today()))[other()]) msgs.push(o + " hat die Frage des Tages beantwortet");
  if (!msgs.length) return;
  toast(msgs[0]);
  try { if (document.hidden && "Notification" in window && Notification.permission === "granted") new Notification("Wir zwei", { body: msgs.join("\n"), icon: "icons/icon-192.png" }); } catch (e) {}
}
document.addEventListener("visibilitychange", function () { if (!document.hidden && synced() && (!es || es.readyState === 2)) connect(); });

/* ---------- Datum ---------- */
var WD = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"], WDL = ["Sonntag", "Montag", "Dienstag", "Mittwoch", "Donnerstag", "Freitag", "Samstag"];
var MON = ["Jan", "Feb", "Mär", "Apr", "Mai", "Jun", "Jul", "Aug", "Sep", "Okt", "Nov", "Dez"], MONL = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
function pad(n) { return (n < 10 ? "0" : "") + n; }
function iso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function pISO(s) { var a = s.split("-"); return new Date(+a[0], +a[1] - 1, +a[2]); }
function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
function monday(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
function kw(d) { var t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); var day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); var y = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y) / 864e5 + 1) / 7); }
function shortDate(s) { var d = pISO(s); return WD[d.getDay()] + ", " + d.getDate() + ". " + MON[d.getMonth()]; }
function relDay(s) { var t = iso(today()); if (s === t) return "Heute"; if (s === iso(addDays(today(), 1))) return "Morgen"; if (s === iso(addDays(today(), -1))) return "Gestern"; return shortDate(s); }
function hm(ts) { var d = new Date(ts); return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
function when(ts) {
  var diff = (Date.now() - ts) / 60000;
  if (diff < 1) return "gerade";
  if (diff < 60) return "vor " + Math.floor(diff) + " Min.";
  var day = iso(new Date(ts));
  if (day === iso(today())) return hm(ts);
  if (day === iso(addDays(today(), -1))) return "gestern " + hm(ts);
  return shortDate(day) + " " + hm(ts);
}
function mins(t) { if (!t) return null; var a = t.split(":"); return +a[0] * 60 + +a[1]; }

/* ---------- Dienste ---------- */
var TYPES = ["Früh", "Spät", "Nacht", "Dienstreise", "Mainz", "Auftritt", "Frei", "Urlaub", "Eigene"];
var DEF = { "Früh": ["06:00", "14:00"], "Spät": ["14:00", "22:00"], "Nacht": ["21:30", "06:30"], "Auftritt": ["19:00", "22:00"], "Eigene": ["09:00", "17:00"] };
var ALLDAY = { "Dienstreise": 1, "Mainz": 1 };   /* ganztägig, Uhrzeit freiwillig */
var LONG = { "Früh": "Frühdienst", "Spät": "Spätdienst", "Nacht": "Nachtdienst", "Frei": "Frei", "Urlaub": "Urlaub", "Eigene": "Dienst", "Dienstreise": "Dienstreise", "Mainz": "Mainz", "Auftritt": "Auftritt" };
function busyText(p, s) {
  var n = person(p).name, t = s.from ? " (" + s.from + "–" + s.to + ")" : "";
  if (s.type === "Dienstreise") return n + " ist auf Dienstreise" + t;
  if (s.type === "Mainz") return n + " ist in Mainz" + t;
  if (s.type === "Auftritt") return n + " hat einen Auftritt" + t;
  return n + " hat " + LONG[s.type] + t;
}
function isWork(t) { return t && t !== "Frei" && t !== "Urlaub"; }
function shift(p, date) { return coll("shifts")[p + "_" + date] || null; }
function shiftTime(s) { if (!isWork(s.type)) return ""; if (s.from) return s.from + "–" + (s.to || "?"); return ALLDAY[s.type] ? "ganztägig" : ""; }

/* ---------- Ansicht wechseln ---------- */
function show(t) {
  var prevTab = tab; tab = t;
  if (prevTab !== t) markSeen(prevTab);
  viewSince[t] = seen[t] || 0;
  $$("main.view[data-view]").forEach(function (m) { m.hidden = m.getAttribute("data-view") !== t; });
  $$("nav.tabs button").forEach(function (b) { if (b.getAttribute("data-tab") === t) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  render(); window.scrollTo(0, 0);
  markSeen(t);
}
function markSeen(t) { seen[t] = Date.now(); LS.set("seen", seen); }
$$("nav.tabs button").forEach(function (b) { b.addEventListener("click", function () { show(b.getAttribute("data-tab")); }); });

function render() {
  try {
    if (tab === "heute") renderHeute();
    if (tab === "dienste") renderDienste();
    if (tab === "einkauf") renderEinkauf();
    if (tab === "events") renderEvents();
    if (tab === "haushalt") renderHaushalt();
    if (tab === "spiele") renderSpiele();
  } catch (e) { console.error(e); }
  renderBadges(); updateStatus();
}
function partnerNewer(k, area) { var since = seen[area] || 0; return entries(k).filter(function (v) { return v.by && v.by !== me() && (v.at || 0) > since; }).length; }
function renderBadges() {
  var c = { dienste: partnerNewer("shifts", "dienste"), einkauf: partnerNewer("shop", "einkauf"), events: partnerNewer("events", "events"), haushalt: partnerNewer("log", "haushalt") + partnerNewer("todos", "haushalt"), spiele: gamesTodo() };
  Object.keys(c).forEach(function (k) {
    var b = $('nav.tabs button[data-tab="' + k + '"] .badge'); if (!b) return;
    var n = (k === tab && k !== "spiele") ? 0 : c[k]; b.hidden = !n; b.textContent = n > 9 ? "9+" : n;
  });
}
function isNew(v, area) { return v.by && v.by !== me() && (v.at || 0) > (viewSince[area] || 0); }

function updateStatus() {
  var el = $("#h-status"); if (!el) return;
  var html;
  if (!synced()) html = '<button class="status local" data-act="settings"><i></i>Nur auf diesem Handy gespeichert. Hier tippen, um euch zu verbinden.</button>';
  else if (online === "ok" && !queue.length) html = '<div class="status ok"><i></i>Verbunden mit ' + esc(person(other()).name) + '</div>';
  else html = '<div class="status off"><i></i>' + (queue.length ? "Offline. " + queue.length + " Änderung" + (queue.length > 1 ? "en werden" : " wird") + " nachgereicht." : "Verbindung wird aufgebaut …") + "</div>";
  if (el.innerHTML !== html) el.innerHTML = html;
  var b = $("[data-act=settings]", el); if (b) b.onclick = openSettings;
}

/* ---------- HEUTE ---------- */
function renderHeute() {
  var t = today(), ts = iso(t), tm = iso(addDays(t, 1));
  var h = new Date().getHours();
  $("#h-date").textContent = WDL[t.getDay()] + ", " + t.getDate() + ". " + MONL[t.getMonth()];
  $("#h-hello").textContent = (h < 11 ? "Guten Morgen" : h < 18 ? "Hallo" : "Guten Abend") + ", " + person(me()).name;
  var html = "";
  // Dienste heute
  html += '<section class="card"><div class="card-h"><h2>Heute</h2><button class="link" data-go="dienste">Dienstplan</button></div>';
  ["p1", "p2"].forEach(function (p) {
    var s = shift(p, ts);
    if (!s) html += '<div class="shiftrow none">' + av(p) + '<span><b>' + esc(nm(p)) + '</b><small>Noch nichts eingetragen</small></span></div>';
    else html += '<div class="shiftrow ' + (isWork(s.type) ? p : "none") + '">' + av(p) + '<span><b>' + esc(nm(p)) + " · " + esc(LONG[s.type]) + '</b><small>' + esc(shiftTime(s) || (s.note || "")) + (shiftTime(s) && s.note ? " · " + esc(s.note) : "") + '</small></span></div>';
  });
  var tomorrow = ["p1", "p2"].map(function (p) { var s = shift(p, tm); return esc(nm(p)) + " " + (s ? esc(LONG[s.type]) + (shiftTime(s) ? " " + shiftTime(s) : "") : "–"); }).join(" · ");
  html += '<div class="muted">Morgen: ' + tomorrow + "</div></section>";
  // Haushalt zuletzt
  var logs = entries("log").sort(function (a, b) { return b.at - a.at; }).slice(0, 3);
  html += '<section class="card"><div class="card-h"><h2>Zuletzt erledigt</h2><button class="link" data-go="haushalt">Haushalt</button></div>';
  if (!logs.length) html += '<div class="muted">Hier erscheint, was ihr im Haushalt erledigt habt.</div>';
  logs.forEach(function (l) { html += '<div class="row">' + av(l.by) + '<span style="flex:1;font-size:14px;font-weight:600">' + esc(nm(l.by)) + ": " + esc(l.title) + '</span><span class="muted">' + when(l.at) + "</span></div>"; });
  html += '<button class="btn sec" data-act="log">Ich habe etwas erledigt</button></section>';
  // Kacheln
  var openShop = entries("shop").filter(function (v) { return !v.done; }).length;
  var openTodo = entries("todos").length;
  var next = upcomingEvents()[0];
  html += '<div class="grid2">';
  html += '<button class="tile" data-go="einkauf"><span class="num">' + openShop + '</span><span class="muted" style="font-weight:600">offen auf der Einkaufsliste</span></button>';
  html += '<button class="tile" data-go="events">' + (next ? '<span class="t">' + esc(relDay(next.date)) + " · " + esc(next.title) + '</span><span class="muted" style="font-weight:600">' + (next.time ? esc(next.time) + " Uhr" : "ganztägig") + "</span>" : '<span class="t">Kein Event</span><span class="muted" style="font-weight:600">Etwas zusammen planen</span>') + "</button>";
  html += "</div>";
  var qd = quizDay(ts);
  if (!qd[me()]) html += '<button class="tile" data-go="spiele" style="flex-direction:row;align-items:center;gap:12px;width:100%"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.5v.7M12 17h.01"/></svg><span style="display:flex;flex-direction:column"><span class="t">Frage des Tages</span><span class="muted" style="font-weight:600">' + (qd[other()] ? esc(person(other()).name) + " hat schon geantwortet" : "Noch nicht beantwortet") + "</span></span></button>";
  if (openTodo) html += '<button class="tile" data-go="haushalt" style="flex-direction:row;align-items:center;gap:12px;width:100%"><span class="num">' + openTodo + '</span><span class="muted" style="font-weight:600">Aufgabe' + (openTodo > 1 ? "n" : "") + " im Haushalt eingetragen</span></button>";
  $("#h-body").innerHTML = html;
  bindCommon($("#h-body"));
}
function bindCommon(root) {
  $$("[data-go]", root).forEach(function (b) { b.onclick = function () { var g = b.getAttribute("data-go"); if (g === "spiele") { gameTab = "quiz"; LS.set("gtab", gameTab); } show(g); }; });
  $$("[data-act=log]", root).forEach(function (b) { b.onclick = function () { openLog(); }; });
}
$("#btn-settings").onclick = function () { openSettings(); };

/* ---------- DIENSTE ---------- */
function renderDienste() {
  var mon = addDays(monday(today()), weekOffset * 7), sun = addDays(mon, 6), ts = iso(today());
  $("#wk-label").textContent = "KW " + kw(mon);
  $("#wk-today").hidden = weekOffset === 0;
  var html = '<div class="dgrid dhead" style="margin-bottom:8px"><span>' + mon.getDate() + "." + (mon.getMonth() !== sun.getMonth() ? (mon.getMonth() + 1) + "." : "") + "–" + sun.getDate() + "." + (sun.getMonth() + 1) + '.</span><span><span class="dot" style="background:var(--a)"></span>' + esc(person("p1").name) + '</span><span><span class="dot" style="background:var(--b)"></span>' + esc(person("p2").name) + "</span></div>";
  html += '<div style="display:flex;flex-direction:column;gap:6px">';
  for (var i = 0; i < 7; i++) {

function showSetup() {
  var html = '<h1 style="font-size:34px">Wir zwei</h1><p class="help" style="font-size:15px">Dienstpläne, Einkaufsliste, Events und Haushalt, gemeinsam für euch beide.</p>';
  html += '<section class="card"><div class="fl"><label for="su-n1">Dein Name</label><input class="f" id="su-n1" autocomplete="given-name"></div><div class="fl"><label for="su-n2">Name deiner Partnerin / deines Partners</label><input class="f" id="su-n2"></div><button class="btn" id="su-go">Los geht\'s</button></section>';
  html += '<section class="card"><h2>Schon eingeladen?</h2><div class="fl"><label for="su-inv">Einladungslink einfügen</label><input class="f" id="su-inv" autocapitalize="off"></div><button class="btn sec" id="su-join">Beitreten</button></section>';
  $("#setup-body").innerHTML = html; $("#setup").hidden = false;
  $("#su-go").onclick = function () {
    var n1 = $("#su-n1").value.trim(), n2 = $("#su-n2").value.trim(); if (!n1 || !n2) { toast("Bitte beide Namen eintragen"); return; }
    tree.people = { p1: { name: n1 }, p2: { name: n2 } }; cfg.me = "p1"; save(); $("#setup").hidden = true; show("heute");
    if (DEFAULT_DB && !synced()) connectTo(DEFAULT_DB, function () { toast("Verbunden. Einladungslink unter Einstellungen teilen."); }, function () {});
  };
  $("#su-join").onclick = function () { var o = parseInvite($("#su-inv").value); if (!o) { toast("Das ist kein gültiger Einladungslink"); return; } startJoin(o); };
}
function startJoin(o) {
  var u = cleanUrl(o.u); if (!u) { toast("Einladungslink ist ungültig"); return; }
  $("#setup-body").innerHTML = '<h1>Verbinden …</h1>'; $("#setup").hidden = false;
  fetch(u + "/paare/" + o.c + ".json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (data) {
    if (!data || !data.people) throw new Error("leer");
    var html = '<h1>Wer bist du?</h1><p class="help" style="font-size:15px">Dieses Handy wird mit eurer gemeinsamen App verbunden. Was hier vorher gespeichert war, wird ersetzt.</p><div style="display:flex;flex-direction:column;gap:10px">';
    ["p1", "p2"].forEach(function (p) { html += '<button class="btn sec big" data-p="' + p + '" style="justify-content:flex-start">' + '<span class="av av-' + p + ' lg">' + esc(((data.people[p] || {}).name || "?").charAt(0).toUpperCase()) + "</span>" + esc((data.people[p] || {}).name || p) + "</button>"; });
    html += '</div><button class="link" id="jn-cancel">Abbrechen</button>';
    $("#setup-body").innerHTML = html;
    $$("#setup-body [data-p]").forEach(function (b) { b.onclick = function () { cfg = { me: b.getAttribute("data-p"), url: u, code: o.c }; tree = data; queue = []; var nw0 = Date.now(); seen = { dienste: nw0, einkauf: nw0, events: nw0, haushalt: nw0 }; LS.set("seen", seen); save(); $("#setup").hidden = true; connect(); show("heute"); toast("Verbunden"); }; });
    $("#jn-cancel").onclick = function () { if (cfg.me) $("#setup").hidden = true; else showSetup(); };
  }).catch(function (e) { $("#setup-body").innerHTML = '<h1>Hat nicht geklappt</h1><p class="help">Der Einladungslink funktioniert gerade nicht (' + esc(e.message) + '). Internet prüfen und nochmal versuchen.</p><button class="btn" id="jn-back">Zurück</button>'; $("#jn-back").onclick = function () { if (cfg.me) $("#setup").hidden = true; else showSetup(); }; });
}

/* ---------- Start ---------- */
(function init() {
  var inv = location.hash.indexOf("join=") >= 0 ? parseInvite(location.hash) : null;
  if (inv) { try { history.replaceState(null, "", location.pathname); } catch (e) {} if (!cfg.me || cfg.code !== inv.c) { startJoin(inv); } }
  else if (!cfg.me) showSetup();
  show("heute");
  connect(); flush();
  setInterval(function () { if (tab === "heute") renderHeute(); }, 60000);
  if ("serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} }
})();
</script>
</body>
</html>
