<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F6FA"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Wir zwei"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Wir zwei</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F6FA;--card:#fff;--ink:#1B1E2B;--mute:#5B6172;--line:#E3E6EE;--line2:#D5D8E1;
--a:#2F5BD8;--at:#E5ECFC;--ai:#1E3A8A;--b:#B9470B;--bt:#FCEBDD;--bi:#7C2D07;
--ok:#157347;--okt:#DFF3E8;--oki:#0F5132;--warn:#8A3A00;--warnt:#FFF1D6;--danger:#A61B1B;
--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.view{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 20px) 16px calc(var(--safe-b) + 104px);display:flex;flex-direction:column;gap:14px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.kicker{font-size:13px;color:var(--mute);font-weight:600}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.5px}
h2{margin:0;font-size:16px;font-weight:700}
.label{margin:6px 0 0;font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--a);font-weight:700;font-size:14px;padding:6px 0;min-height:36px}
.icon{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0}
.icon.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn{height:52px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 18px;width:100%}
.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line2)}
.btn.danger{background:var(--card);color:var(--danger);border:1px solid #E3B4B4}
.btn.big{height:60px;font-size:16px;border-radius:18px}
.muted{color:var(--mute);font-size:13px}
.av{width:28px;height:28px;border-radius:50%;color:#fff;font-weight:700;font-size:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.av-p1{background:var(--a)}.av-p2{background:var(--b)}.av.lg{width:36px;height:36px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
.pill.ok{background:var(--okt);color:var(--oki)}.pill.warn{background:var(--warnt);color:var(--warn)}.pill.mute{background:#E9EBF1;color:var(--mute)}
.new{font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:6px;padding:2px 6px;letter-spacing:.3px}
input.f,select.f,textarea.f{width:100%;height:48px;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:0 14px;font-size:16px}
textarea.f{height:72px;padding:12px 14px;resize:none}
.fl{display:flex;flex-direction:column;gap:6px}.fl>label,.fl>.lab{font-size:13px;font-weight:700;color:var(--mute)}
.row{display:flex;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#E9EBF1;padding:4px;border-radius:14px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg button{height:44px;border-radius:11px;border:0;background:transparent;color:var(--mute);font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chip{height:46px;border-radius:12px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:14px}
.chip[aria-pressed=true]{background:var(--sel,var(--ink));border-color:var(--sel,var(--ink));color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip{height:40px;padding:0 14px;border-radius:999px;font-size:13px}
/* Heute */
.shiftrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px}
.shiftrow.p1{background:var(--at);color:var(--ai)}.shiftrow.p2{background:var(--bt);color:var(--bi)}
.shiftrow.none{background:#F0F1F5;color:var(--mute)}
.shiftrow b{display:block;font-size:14px}.shiftrow small{font-size:12px;font-weight:600}
.tile{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;border:0;text-align:left}
.tile .num{font-size:26px;font-weight:800;line-height:1.1}.tile .t{font-size:17px;font-weight:800;line-height:1.25}
.status{display:flex;gap:8px;align-items:center;font-size:13px;font-weight:600;border-radius:14px;padding:10px 12px;border:0;text-align:left;width:100%}
.status.ok{background:var(--okt);color:var(--oki)}.status.local{background:#E9EBF1;color:var(--mute)}.status.off{background:var(--warnt);color:var(--warn)}
.status i{width:9px;height:9px;border-radius:50%;background:currentColor;flex-shrink:0}
/* Dienste */
.wk{display:flex;gap:6px;align-items:center}.wk span{font-size:13px;font-weight:700;min-width:58px;text-align:center}
.dgrid{display:grid;grid-template-columns:48px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch}
.dhead{font-size:12px;font-weight:700;color:var(--mute);padding:0 6px}
.dhead span{display:inline-flex;gap:6px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.day{padding:6px;border-radius:16px}.day.today{background:var(--card);box-shadow:0 0 0 2px var(--ink) inset}.day.both{background:#EAF7EF}
.dl{display:flex;flex-direction:column;justify-content:center}.dl small{font-size:12px;font-weight:600;color:var(--mute)}.dl b{font-size:18px;font-weight:800}
.cell{border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:1px;min-height:48px;border:0;text-align:left;width:100%}
.cell b{font-size:13px}.cell small{font-size:11px;font-weight:600}
.cell.p1{background:var(--at);color:var(--ai)}.cell.p2{background:var(--bt);color:var(--bi)}
.cell.free{background:var(--card);color:var(--mute);border:1px dashed #B9BDC9}
.cell.empty{background:transparent;border:1px dashed var(--line2);color:var(--mute);align-items:center;font-size:20px}
.bothtag{margin:8px 0 0 56px}
/* Listen */
.list{background:var(--card);border-radius:16px;display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;min-height:54px;padding:4px 8px 4px 14px;border-bottom:1px solid #F0F1F5}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:8px 0;min-height:46px}
.item .txt{flex:1;min-width:0;font-size:15px;font-weight:600;overflow-wrap:anywhere}
.item .sub{display:block;font-size:12px;color:var(--mute);font-weight:600}
.box{width:24px;height:24px;border-radius:8px;border:2px solid #9AA0B0;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.done .box{background:var(--ok);border-color:var(--ok)}.done .txt{color:var(--mute);text-decoration:line-through}
.x{width:40px;height:40px;border:0;background:none;color:var(--mute);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.addrow{display:flex;gap:8px}.addrow input{flex:1}
.empty-hint{background:var(--card);border-radius:16px;padding:18px;color:var(--mute);font-size:14px;text-align:center}
.ev{background:var(--card);border-radius:18px;padding:14px;display:flex;gap:14px;border:0;text-align:left;width:100%}
.cal{width:52px;height:60px;border-radius:14px;background:#F0F1F5;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.cal small{font-size:11px;font-weight:700;color:var(--mute)}.cal b{font-size:20px;font-weight:800;line-height:1.1}
.ev .body{display:flex;flex-direction:column;gap:5px;flex:1;min-width:0}.ev .ttl{font-size:16px;font-weight:700}
.conf{font-size:12px;font-weight:700;color:var(--warn);background:var(--warnt);padding:6px 8px;border-radius:8px}
.okline{font-size:12px;font-weight:700;color:var(--oki)}
.freebox{background:var(--okt);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;color:var(--oki)}
.freebox .chip{border-color:var(--ok);color:var(--oki);background:#fff}
.logday{font-size:12px;font-weight:800;color:var(--mute);padding:10px 14px 2px;text-transform:uppercase;letter-spacing:.5px}
.logitem{display:flex;gap:10px;align-items:center;padding:8px 8px 8px 14px;min-height:50px}
.logitem .txt{flex:1;font-size:14px;font-weight:600;min-width:0;overflow-wrap:anywhere}.logitem .txt small{display:block;font-size:12px;color:var(--mute)}
.logitem time{font-size:12px;color:var(--mute);font-weight:700}
/* Nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(var(--safe-b) + 8px);z-index:10}
nav.tabs button{border:0;background:none;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;min-width:52px;flex:1;max-width:80px;min-height:52px;justify-content:center;position:relative}
nav.tabs button[aria-current=page]{color:var(--ink);font-weight:800}
nav.tabs button[aria-current=page] svg{stroke-width:2.3}
.badge{position:absolute;top:2px;right:8px;min-width:18px;height:18px;border-radius:9px;background:var(--b);color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px}
/* Sheet */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;background:rgba(15,17,26,.45)}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 18px calc(var(--safe-b) + 20px);display:flex;flex-direction:column;gap:16px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}@media(prefers-reduced-motion:reduce){.panel{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:#C9CCD6;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}.ph h2{font-size:20px;font-weight:800}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}.actions.one{grid-template-columns:1fr}
.setup{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto}
.setup .view{padding-bottom:40px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--safe-t) + 12px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:50;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.help{font-size:13px;color:var(--mute);line-height:1.5;margin:0}.help code{background:#E9EBF1;padding:1px 5px;border-radius:5px;font-size:12px}
details.card summary{font-weight:700;cursor:pointer}
.score{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border-radius:16px;padding:10px}
.score b{font-size:22px;font-weight:800;min-width:24px;text-align:center}
.topicrow{flex-wrap:nowrap;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none}.topicrow::-webkit-scrollbar{display:none}.topicrow .chip{flex-shrink:0}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;padding:10px 14px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-size:15px;font-weight:600;text-align:left;color:var(--ink)}
.qopt:disabled{cursor:default;opacity:1}
.qopt.mine{border:2px solid var(--ink)}
.qopt.right{background:var(--okt);border-color:var(--ok);color:var(--oki)}
.qopt.wrong{background:#FDECEC;border-color:#E3B4B4;color:var(--danger)}
.qopt .marks{display:flex;gap:4px}
.res{font-size:12px;font-weight:800;border-radius:8px;padding:3px 7px}.res.y{background:var(--okt);color:var(--oki)}.res.n{background:#FDECEC;color:var(--danger)}
.drawcard{background:var(--card);border-radius:18px;padding:10px;display:flex;gap:12px;align-items:center}
.drawimg{width:84px;height:84px;border-radius:12px;overflow:hidden;border:1px solid var(--line);padding:0;background:#fff;flex-shrink:0}
.drawimg img{width:100%;height:100%;display:block}
.drawcard .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;font-size:14px}
.wordbox{background:var(--card);border-radius:16px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wordbox b{font-size:24px;font-weight:800}
.drawcv{display:block;margin:0 auto;border-radius:16px;background:#fff;border:1px solid var(--line2);touch-action:none}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid var(--line2);padding:0}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.bigimg{width:100%;max-width:420px;align-self:center;border-radius:16px;border:1px solid var(--line2);background:#fff;display:block}
.wheelwrap{position:relative;display:flex;justify-content:center;padding-top:6px}
.pointer{position:absolute;top:0;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:24px solid var(--ink);z-index:2}
.wheelres{text-align:center;font-size:26px;font-weight:800;min-height:36px}
.wheelmini{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:conic-gradient(#2F5BD8 0 25%,#B9470B 0 50%,#157347 0 75%,#7B1FA2 0)}
.seg.four{grid-template-columns:repeat(4,minmax(0,1fr))}.seg.four button{font-size:13px}
.statchips{gap:6px}.statchips .chip{height:38px;padding:0 12px;font-size:13px}
.stockgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stock{display:flex;align-items:stretch;background:var(--card);border-radius:12px;border-left:0;overflow:hidden;min-height:50px}
.stmain{flex:1;min-width:0;border:0;background:none;text-align:left;padding:7px 4px 7px 12px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.stmain .sn{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stmain .sl{font-size:11px;font-weight:700;display:flex;align-items:center;gap:5px}
.stmain .sl i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.lv2 .sl{color:var(--oki)}.lv1 .sl{color:var(--warn)}.lv0 .sl{color:var(--danger)}
.lv0{background:#FDF1F1}.lv1{background:#FFF7E6}
.stmore{width:38px;border:0;background:none;color:var(--mute);display:flex;align-items:center;justify-content:center}
.rzicon{width:44px;height:44px;border-radius:12px;background:var(--bt);color:var(--bi);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ingrow{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px;font-weight:600;border-bottom:1px solid #F0F1F5}
.ingrow input{width:22px;height:22px;accent-color:var(--ink);flex-shrink:0}
.pillbtn{border:1px solid var(--line2);background:var(--card);border-radius:999px;height:36px;padding:0 12px;font-size:13px;font-weight:700;flex-shrink:0}
.card.secret{background:#F3EEFB}
.lastline{display:flex;gap:10px;align-items:flex-start;font-size:17px;font-weight:600;line-height:1.45;background:#F7F8FB;border-radius:14px;padding:12px}
.hiddenlines{display:flex;flex-direction:column;gap:6px}.hiddenlines span{height:10px;border-radius:5px;background:#E3E6EE}.hiddenlines span:nth-child(odd){width:85%}.hiddenlines span:nth-child(even){width:70%}
.storytext{font-size:17px;line-height:1.7;background:var(--card);border-radius:16px;padding:16px}
.storytext .sp-p1{color:var(--ai)}.storytext .sp-p2{color:var(--bi)}
.updline{font-size:20px;font-weight:800;line-height:1.35;background:var(--ink);color:#fff;border-radius:18px;padding:18px}
.newsrow{display:flex;gap:10px;align-items:flex-start;font-size:15px;font-weight:600;line-height:1.4}
.newsdot{width:8px;height:8px;border-radius:50%;background:var(--b);margin-top:7px;flex-shrink:0}
.stars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stars button{border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--mute)}
.stars .st{font-size:28px;line-height:1;color:#C9CCD6}
.stars button.on{border-color:#E8A100;background:#FFF7E0;color:var(--ink)}.stars button.on .st{color:#E8A100}
.updbanner{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 78px);z-index:20;background:var(--ink);color:#fff;border-radius:16px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:536px;margin:0 auto}
.updbanner span{flex:1}.updbanner button{border:0;background:#fff;color:var(--ink);border-radius:10px;height:40px;padding:0 14px;font-weight:800;flex-shrink:0}
.fbrow{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid #F0F1F5}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<!-- ========== HEUTE ========== -->
<main class="view" id="v-heute" data-view="heute">
  <div class="top">
    <div><div class="kicker" id="h-date"></div><h1 id="h-hello">Hallo</h1></div>
    <button class="icon" id="btn-settings" aria-label="Einstellungen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div id="h-status"></div>
  <div id="h-body"></div>
</main>

<!-- ========== DIENSTE ========== -->
<main class="view" id="v-dienste" data-view="dienste" hidden>
  <div class="top">
    <h1>Dienstplan</h1>

function renderHaushalt() {
  var todos = entries("todos").sort(function (a, b) { return a.at - b.at; });
  var th = "";
  if (!todos.length) th = '<div class="empty-hint">Nichts eingetragen. Wenn etwas gemacht werden muss, oben eintragen.</div>';
  else th = '<div class="list">' + todos.map(function (v) {
    var nw = isNew(v, "haushalt") ? ' <span class="new">NEU</span>' : "";
    return '<div class="item"><button class="main" data-todo="' + v.id + '" aria-label="' + esc(v.title) + ' als erledigt melden"><span class="box"></span><span class="txt">' + esc(v.title) + nw + '<span class="sub">eingetragen von ' + esc(von(v.by)) + " · " + when(v.at) + '</span></span></button><button class="x" data-tdel="' + v.id + '" aria-label="' + esc(v.title) + ' entfernen">' + ICON_X + "</button></div>";
  }).join("") + "</div>";
  $("#t-list").innerHTML = th;
  $$("#t-list [data-todo]").forEach(function (b) { b.onclick = function () { var id = b.getAttribute("data-todo"), v = coll("todos")[id]; if (!v) return; write("log/" + rid(), { title: v.title, by: me(), at: Date.now() }); write("todos/" + id, null); toast("Erledigt gemeldet: " + v.title); }; });
  $$("#t-list [data-tdel]").forEach(function (b) { b.onclick = function () { ask("Aufgabe entfernen, ohne sie als erledigt zu melden?", function () { write("todos/" + b.getAttribute("data-tdel"), null); }, "Entfernen"); }; });

  var logs = entries("log").sort(function (a, b) { return b.at - a.at; }).slice(0, 60);
  var lh = "";
  if (!logs.length) lh = '<div class="empty-hint">Noch nichts gemeldet. Wenn du etwas erledigt hast, tippe oben auf „Ich habe etwas erledigt“. Dann sieht es ' + esc(person(other()).name) + " sofort.</div>";
  else {
    lh = '<div class="list">'; var lastDay = "";
    logs.forEach(function (v) {
      var day = iso(new Date(v.at));
      if (day !== lastDay) { lh += '<div class="logday">' + esc(relDay(day)) + "</div>"; lastDay = day; }
      var nw = isNew(v, "haushalt") ? ' <span class="new">NEU</span>' : "";
      lh += '<div class="logitem">' + av(v.by) + '<span class="txt">' + esc(v.title) + nw + "<small>" + esc(nm(v.by)) + (v.note ? " · " + esc(v.note) : "") + "</small></span><time>" + hm(v.at) + "</time>" + (v.by === me() ? '<button class="x" data-ldel="' + v.id + '" aria-label="Eintrag löschen">' + ICON_X + "</button>" : '<span style="width:40px"></span>') + "</div>";
    });
    lh += "</div>";
  }
  $("#l-list").innerHTML = lh;
  $$("#l-list [data-ldel]").forEach(function (b) { b.onclick = function () { ask("Diesen Eintrag löschen?", function () { write("log/" + b.getAttribute("data-ldel"), null); }, "Löschen"); }; });
}

$("#log-add").onclick = function () { openLog(); };
function openLog() {
  // Vorschläge nur aus euren eigenen Einträgen
  var freq = {};
  entries("log").forEach(function (v) { var k = v.title.trim(); freq[k] = (freq[k] || 0) + 1; });
  var todoTitles = entries("todos").map(function (v) { return v.title; });
  var sugg = todoTitles.concat(Object.keys(freq).sort(function (a, b) { return freq[b] - freq[a]; })).filter(function (x, i, a) { return a.indexOf(x) === i; }).slice(0, 10);
  var html = '<div class="grab"></div><div class="ph"><h2>Was hast du erledigt?</h2><button class="icon" data-close aria-label="Schließen">' + ICON_X + "</button></div>";
  html += '<div class="fl"><label for="lg-title">Erledigt</label><input class="f" id="lg-title" placeholder="z. B. Geschirrspüler ausgeräumt" enterkeyhint="done"></div>';
  if (sugg.length) html += '<div class="fl"><span class="lab">Schnell wählen</span><div class="chips">' + sugg.map(function (s) { return '<button type="button" class="chip" data-s="' + esc(s) + '">' + esc(s) + "</button>"; }).join("") + "</div></div>";
  html += '<div class="fl"><label for="lg-note">Notiz (optional)</label><input class="f" id="lg-note" placeholder="z. B. Tabs sind alle"></div>';
  html += '<button class="btn" id="lg-save">Melden</button>';
  html += '<p class="help">' + esc(person(other()).name) + " sieht den Eintrag sofort im Haushalt.</p>";
  openSheet(html);
  setTimeout(function () { try { $("#lg-title").focus(); } catch (e) {} }, 250);
  $$("#panel [data-s]").forEach(function (b) { b.onclick = function () { $("#lg-title").value = b.getAttribute("data-s"); $$("#panel [data-s]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); }; });
  function submit() {
    var t = $("#lg-title").value.trim(); if (!t) { toast("Bitte eintragen, was du erledigt hast"); return; }
    write("log/" + rid(), { title: t, note: $("#lg-note").value.trim(), by: me(), at: Date.now() });
    entries("todos").forEach(function (v) { if (v.title.trim().toLowerCase() === t.toLowerCase()) write("todos/" + v.id, null); });
    closeSheet(); toast("Gemeldet: " + t);
  }
  $("#lg-save").onclick = submit;
  $("#lg-title").onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); submit(); } };
}

function fill(t) { return t.replace(/\{n\}/g, builder()).replace(/\{v\}/g, APP_VER); }
function pick(arr) { return fill(arr[Math.floor(Math.random() * arr.length)]); }
function askFeedbackOn() { var v = LS.get("askfb", null); return v === null ? me() !== "p1" : v; }

function checkNewVersion() {
  if (!cfg.me) { LS.set("lastver", APP_VER); return; }
  var last = LS.get("lastver", "1.5");
  if (verCmp(APP_VER, last) <= 0) return;
  LS.set("lastver", APP_VER);
  var news = Object.keys(CHANGES).filter(function (v) { return verCmp(v, last) > 0 && verCmp(v, APP_VER) <= 0; }).sort(function (a, b) { return verCmp(b, a); });
  var html = '<div class="grab"></div><div class="ph"><h2>Update ' + APP_VER + '</h2><button class="icon" data-close aria-label="Schließen">' + ICON_X + '</button></div>';
  html += '<div class="updline">' + esc(pick(UPD_LINES)) + "</div>";
  html += '<section class="card" style="gap:8px"><h2>Was ist neu?</h2>' + news.map(function (v) { return CHANGES[v].map(function (c) { return '<div class="newsrow"><span class="newsdot" aria-hidden="true"></span><span>' + esc(c) + "</span></div>"; }).join(""); }).join("") + "</section>";
  html += '<button class="btn" data-close>Alles klar, zeig her!</button>';
  setTimeout(function () { if ($("#sheet").hidden && $("#setup").hidden) openSheet(html); }, 600);
}
/* Nutzungszeit seit dem Update zählen, nach 3 Minuten fragen */
var fbTimer = setInterval(function () {
  if (!cfg.me || document.hidden || !askFeedbackOn()) return;
  var done = LS.get("fbdone", {}); if (done[APP_VER]) return;
  var used = LS.get("fbused", {}); used[APP_VER] = (used[APP_VER] || 0) + 10; LS.set("fbused", used);
  if (used[APP_VER] >= 180 && $("#sheet").hidden && $("#setup").hidden && $("#ask").hidden) openFeedback();
}, 10000);
function openFeedback() {
  var html = '<div class="grab"></div><div class="ph"><h2>Kurze Frage</h2><button class="icon" data-close aria-label="Später">' + ICON_X + '</button></div>';
  html += '<div class="updline">' + esc(pick(FB_LINES)) + '</div><p class="help">Update ' + APP_VER + ". " + esc(builder()) + " bekommt deine Antwort.</p>";
  html += '<div class="stars" role="radiogroup" aria-label="Bewertung">' + STARS.map(function (s, i) { return '<button type="button" role="radio" aria-checked="false" data-star="' + (i + 1) + '" aria-label="' + (i + 1) + " Sterne: " + s + '"><span class="st" aria-hidden="true">★</span><span>' + s + "</span></button>"; }).join("") + "</div>";
  html += '<div class="fl"><label for="fb-text">Noch was sagen? (optional)</label><textarea class="f" id="fb-text" maxlength="500" placeholder="Was ist super, was nervt, was fehlt?"></textarea></div>';
  html += '<div class="actions"><button class="btn sec" id="fb-later">Später</button><button class="btn" id="fb-send">Abschicken</button></div>';
  openSheet(html);
  var stars = 0;
  $$("#panel [data-star]").forEach(function (b) { b.onclick = function () { stars = +b.getAttribute("data-star"); $$("#panel [data-star]").forEach(function (x) { var on = +x.getAttribute("data-star") <= stars; x.classList.toggle("on", on); x.setAttribute("aria-checked", +x.getAttribute("data-star") === stars); }); }; });
  $("#fb-later").onclick = function () { var used = LS.get("fbused", {}); used[APP_VER] = 0; LS.set("fbused", used); closeSheet(); };
  $("#fb-send").onclick = function () {
    if (!stars) { toast("Tipp erst auf die Sterne"); return; }
    write("feedback/" + APP_VER.replace(/\./g, "_") + "/" + me(), { stars: stars, text: $("#fb-text").value.trim(), at: Date.now(), by: me(), v: APP_VER });
    var done = LS.get("fbdone", {}); done[APP_VER] = true; LS.set("fbdone", done);
    closeSheet(); toast(stars >= 4 ? "Danke! " + builder() + " freut sich." : "Danke für die Ehrlichkeit! " + builder() + " schraubt weiter.");
  };
}
function feedbackList() { var out = []; var f = tree.feedback || {}; Object.keys(f).forEach(function (v) { Object.keys(f[v] || {}).forEach(function (p) { var x = Object.assign({}, f[v][p]); x.key = v + "/" + p; out.push(x); }); }); return out.sort(function (a, b) { return b.at - a.at; }); }
function starStr(n) { var s = ""; for (var i = 1; i <= 5; i++) s += i <= n ? "★" : "☆"; return s; }

/* Prüfen, ob auf GitHub schon eine neuere Version liegt */
var updShown = false;
function checkRemoteUpdate() {
  if (updShown || !navigator.onLine || location.protocol !== "https:") return;
  fetch("index.html?check=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.text() : ""; }).then(function (t) {
    var m = t.match(/var APP_VER = "([\d.]+)"/); if (!m || verCmp(m[1], APP_VER) <= 0) return;
    updShown = true; var b = $("#upd-banner"); $("#upd-text").textContent = "Update " + m[1] + " ist da! " + pick(["Frisch gebastelt.", "Noch warm.", "Jetzt mit noch mehr Bums."]); b.hidden = false;
  }).catch(function () {});
}
$("#upd-go").onclick = function () { try { navigator.serviceWorker && navigator.serviceWorker.getRegistration().then(function (r) { if (r) r.update(); }); } catch (e) {} setTimeout(function () { location.reload(); }, 300); };
document.addEventListener("visibilitychange", function () { if (!document.hidden) checkRemoteUpdate(); });
setInterval(checkRemoteUpdate, 10 * 60000);

/* ---------- Sheet + Toast ---------- */
var lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  $("#panel").innerHTML = html; $("#sheet").hidden = false; document.body.style.overflow = "hidden";
  $$("#panel [data-close]").forEach(function (b) { b.onclick = closeSheet; });
  var f = $("#panel [data-close]"); if (f) f.focus();
}
function closeSheet() { wheelState = null; $("#sheet").hidden = true; $("#panel").innerHTML = ""; document.body.style.overflow = ""; if (lastFocus && lastFocus.focus) try { lastFocus.focus(); } catch (e) {} }
$("#sheet").addEventListener("click", function (e) { if (e.target === $("#sheet")) closeSheet(); });
document.addEventListener("keydown", function (e) { if (e.key !== "Escape") return; if (!$("#ask").hidden) { $("#ask").hidden = true; return; } if (!$("#sheet").hidden) closeSheet(); });
function ask(msg, yes, label) {
  var d = $("#ask"); $("#ask-msg").textContent = msg; $("#ask-yes").textContent = label || "OK"; d.hidden = false; $("#ask-no").focus();
  $("#ask-no").onclick = function () { d.hidden = true; };
  $("#ask-yes").onclick = function () { d.hidden = true; yes(); };
}
var toastT;
function toast(msg) { var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true; }, Math.min(9000, 3200 + msg.length * 40)); }

/* ---------- Einstellungen + Verbinden ---------- */
function inviteLink() { return location.origin + location.pathname + "#join=" + encodeURIComponent(btoa(JSON.stringify({ u: cfg.url, c: cfg.code }))); }
function parseInvite(s) { var m = String(s).match(/join=([^&\s#]+)/); var raw = m ? m[1] : String(s).trim(); try { var o = JSON.parse(atob(decodeURIComponent(raw))); if (o.u && o.c) return o; } catch (e) {} return null; }
function cleanUrl(u) { u = String(u || "").trim().replace(/\/+$/, ""); if (!/^https:\/\/[a-z0-9.-]+\.(firebaseio\.com|firebasedatabase\.app)$/i.test(u)) return null; return u; }

function openSettings() {
  var html = '<div class="grab"></div><div class="ph"><h2>Einstellungen</h2><button class="icon" data-close aria-label="Schließen">' + ICON_X + "</button></div>";
  html += '<section class="card"><h2>Namen</h2><div class="grid2"><div class="fl"><label for="st-n1">Blau</label><input class="f" id="st-n1" value="' + esc(person("p1").name) + '"></div><div class="fl"><label for="st-n2">Orange</label><input class="f" id="st-n2" value="' + esc(person("p2").name) + '"></div></div>';
  html += '<div class="fl"><span class="lab">Wer benutzt dieses Handy?</span><div class="seg" id="st-me">' + ["p1", "p2"].map(function (x) { return '<button type="button" data-p="' + x + '" aria-pressed="' + (me() === x) + '">' + av(x) + esc(person(x).name) + "</button>"; }).join("") + '</div></div><button class="btn sec" id="st-names">Namen speichern</button></section>';
  html += '<section class="card"><h2>Gemeinsam nutzen</h2>';
  if (synced()) {
    html += '<div class="status ' + (online === "ok" ? "ok" : "off") + '"><i></i>' + (online === "ok" ? "Verbunden" : "Gerade keine Verbindung") + "</div>";
    html += '<p class="help">Schick diesen Link an ' + esc(person(other()).name) + ". Auf dem anderen Handy öffnen, dann seid ihr verbunden.</p>";
    html += '<button class="btn" id="st-share">Einladungslink teilen</button><button class="btn sec" id="st-copy">Link kopieren</button><button class="btn danger" id="st-disc">Verbindung auf diesem Handy trennen</button>';
  } else {
    html += '<p class="help">Eure Datenbank ist schon eingetragen. Auf „Verbinden“ tippen, danach den Einladungslink an den anderen schicken.</p>';
    html += '<div class="fl"><label for="st-url">Datenbank-Adresse</label><input class="f" id="st-url" inputmode="url" autocapitalize="off" placeholder="https://….firebasedatabase.app" value="' + esc(DEFAULT_DB) + '"></div><button class="btn" id="st-conn">Verbinden</button>';
    html += '<div class="fl" style="margin-top:6px"><label for="st-inv">Oder: Einladungslink einfügen</label><input class="f" id="st-inv" autocapitalize="off" placeholder="Link vom anderen Handy"></div><button class="btn sec" id="st-join">Beitreten</button>';
  }
  html += "</section>";
  html += '<section class="card"><h2>Benachrichtigungen</h2><p class="help">Solange die App offen ist oder im Hintergrund läuft, erscheint eine Meldung, wenn der andere etwas einträgt.</p><button class="btn sec" id="st-notif">Benachrichtigungen erlauben</button></section>';
  var fbl = feedbackList();
  html += '<section class="card"><h2>Feedback zu Updates</h2><label class="ingrow" style="border:0"><input type="checkbox" id="st-askfb"' + (askFeedbackOn() ? " checked" : "") + '><span>Mich nach Updates nach meiner Meinung fragen</span></label>' + (fbl.length ? fbl.slice(0, 20).map(function (f) { return '<div class="fbrow"><div class="row" style="justify-content:space-between"><span style="font-weight:700">' + av(f.by) + " " + esc(nm(f.by)) + ' · Update ' + esc(f.v || "") + '</span><span class="muted">' + when(f.at) + '</span></div><div style="color:#B07A00;font-size:18px;letter-spacing:2px" aria-label="' + f.stars + ' von 5 Sternen">' + starStr(f.stars) + "</div>" + (f.text ? '<div style="font-size:14px">„' + esc(f.text) + "“</div>" : "") + "</div>"; }).join("") : '<p class="help">Noch kein Feedback.</p>') + "</section>";
  html += '<section class="card"><h2>Sicherung</h2><div class="grid2"><button class="btn sec" id="st-exp">Exportieren</button><button class="btn sec" id="st-imp">Importieren</button></div><input type="file" id="st-file" accept="application/json" hidden></section>';
  html += '<p class="muted" style="text-align:center">Wir zwei · Version ' + APP_VERSION + "</p>";
  openSheet(html);
  var meSel = me();
  $$("#st-me button").forEach(function (b) { b.onclick = function () { meSel = b.getAttribute("data-p"); $$("#st-me button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); }; });
  $("#st-names").onclick = function () {
    var n1 = $("#st-n1").value.trim() || "Person 1", n2 = $("#st-n2").value.trim() || "Person 2";
    write("people", { p1: { name: n1 }, p2: { name: n2 } }); cfg.me = meSel; save(); closeSheet(); render(); toast("Gespeichert");
  };
  if (synced()) {
    $("#st-share").onclick = function () { var l = inviteLink(); if (navigator.share) navigator.share({ title: "Wir zwei", text: "Unsere gemeinsame App:", url: l }).catch(function () {}); else copy(l); };
    $("#st-copy").onclick = function () { copy(inviteLink()); };
    $("#st-disc").onclick = function () { ask("Verbindung trennen? Die Daten bleiben auf diesem Handy, werden aber nicht mehr geteilt.", function () { cfg.url = ""; cfg.code = ""; queue = []; save(); connect(); closeSheet(); render(); }, "Trennen"); };
  } else {
    $("#st-conn").onclick = function () {
      var u = cleanUrl($("#st-url").value); if (!u) { toast("Die Adresse sollte so aussehen: https://NAME.firebasedatabase.app"); return; }
      connectTo(u, function () { closeSheet(); render(); openSettings(); toast("Verbunden. Jetzt den Einladungslink schicken."); }, function (e) { toast("Verbinden hat nicht geklappt. Adresse und Regeln prüfen (" + e.message + ")."); });
    };
    $("#st-join").onclick = function () { var o = parseInvite($("#st-inv").value); if (!o) { toast("Das ist kein gültiger Einladungslink"); return; } closeSheet(); startJoin(o); };
  }
  $("#st-notif").onclick = function () { if (!("Notification" in window)) { toast("Dieses Handy unterstützt das hier nicht"); return; } Notification.requestPermission().then(function (p) { toast(p === "granted" ? "Benachrichtigungen sind an" : "Nicht erlaubt"); }); };
  $("#st-askfb").onchange = function () { LS.set("askfb", this.checked); };
  $("#st-exp").onclick = function () { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(tree, null, 1)], { type: "application/json" })); a.download = "wir-zwei-sicherung-" + iso(today()) + ".json"; document.body.appendChild(a); a.click(); a.remove(); };
  $("#st-imp").onclick = function () { $("#st-file").click(); };
  $("#st-file").onchange = function () { var f = this.files[0]; if (!f) return; f.text().then(function (t) { var d = JSON.parse(t); ask("Sicherung einspielen? Die aktuellen Daten werden ersetzt.", function () { Object.keys(d).forEach(function (k) { write(k, d[k]); }); closeSheet(); toast("Sicherung eingespielt"); }, "Einspielen"); }).catch(function () { toast("Datei konnte nicht gelesen werden"); }); };
}
function connectTo(u, ok, fail) {
  var code = rid(24);
  tree.people = tree.people || { p1: { name: person("p1").name }, p2: { name: person("p2").name } };
  fetch(u + "/paare/" + code + ".json", { method: "PUT", body: JSON.stringify(tree) })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); cfg.url = u; cfg.code = code; queue = []; save(); connect(); render(); if (ok) ok(); })
    .catch(function (e) { if (fail) fail(e); });
}
function copy(t) { function fb() { var i = document.createElement("textarea"); i.value = t; document.body.appendChild(i); i.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} i.remove(); toast(ok ? "Link kopiert" : "Kopieren ging nicht"); } try { navigator.clipboard.writeText(t).then(function () { toast("Link kopiert"); }, fb); } catch (e) { fb(); } }

/* ---------- Ersteinrichtung + Beitreten ---------- */
function showSetup() {
  var html = '<h1 style="font-size:34px">Wir zwei</h1><p class="help" style="font-size:15px">Dienstpläne, Einkaufsliste, Events und Haushalt, gemeinsam für euch beide.</p>';
  html += '<section class="card"><div class="fl"><label for="su-n1">Dein Name</label><input class="f" id="su-n1" autocomplete="given-name"></div><div class="fl"><label for="su-n2">Name deiner Partnerin / deines Partners</label><input class="f" id="su-n2"></div><button class="btn" id="su-go">Los geht\'s</button></section>';
  html += '<section class="card"><h2>Schon eingeladen?</h2><div class="fl"><label for="su-inv">Einladungslink einfügen</label><input class="f" id="su-inv" autocapitalize="off"></div><button class="btn sec" id="su-join">Beitreten</button></section>';
  $("#setup-body").innerHTML = html; $("#setup").hidden = false;
  $("#su-go").onclick = function () {
    var n1 = $("#su-n1").value.trim(), n2 = $("#su-n2").value.trim(); if (!n1 || !n2) { toast("Bitte beide Namen eintragen"); return; }
    tree.people = { p1: { name: n1 }, p2: { name: n2 } }; cfg.me = "p1"; save(); $("#setup").hidden = true; show("heute");
    if (DEFAULT_DB && !synced()) connectTo(DEFAULT_DB, function () { toast("Verbunden. Einladungslink unter Einstellungen teilen."); }, function () {});
  };
  $("#su-join").onclick = function () { var o = parseInvite($("#su-inv").value); if (!o) { toast("Das ist kein gültiger Einladungslink"); return; } startJoin(o); };
}
function startJoin(o) {
  var u = cleanUrl(o.u); if (!u) { toast("Einladungslink ist ungültig"); return; }
  $("#setup-body").innerHTML = '<h1>Verbinden …</h1>'; $("#setup").hidden = false;
  fetch(u + "/paare/" + o.c + ".json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (data) {
    if (!data || !data.people) throw new Error("leer");
    var html = '<h1>Wer bist du?</h1><p class="help" style="font-size:15px">Dieses Handy wird mit eurer gemeinsamen App verbunden. Was hier vorher gespeichert war, wird ersetzt.</p><div style="display:flex;flex-direction:column;gap:10px">';
    ["p1", "p2"].forEach(function (p) { html += '<button class="btn sec big" data-p="' + p + '" style="justify-content:flex-start">' + '<span class="av av-' + p + ' lg">' + esc(((data.people[p] || {}).name || "?").charAt(0).toUpperCase()) + "</span>" + esc((data.people[p] || {}).name || p) + "</button>"; });
    html += '</div><button class="link" id="jn-cancel">Abbrechen</button>';
    $("#setup-body").innerHTML = html;
    $$("#setup-body [data-p]").forEach(function (b) { b.onclick = function () { cfg = { me: b.getAttribute("data-p"), url: u, code: o.c }; tree = data; queue = []; var nw0 = Date.now(); seen = { dienste: nw0, einkauf: nw0, events: nw0, haushalt: nw0 }; LS.set("seen", seen); save(); $("#setup").hidden = true; connect(); show("heute"); toast("Verbunden"); }; });
    $("#jn-cancel").onclick = function () { if (cfg.me) $("#setup").hidden = true; else showSetup(); };
  }).catch(function (e) { $("#setup-body").innerHTML = '<h1>Hat nicht geklappt</h1><p class="help">Der Einladungslink funktioniert gerade nicht (' + esc(e.message) + '). Internet prüfen und nochmal versuchen.</p><button class="btn" id="jn-back">Zurück</button>'; $("#jn-back").onclick = function () { if (cfg.me) $("#setup").hidden = true; else showSetup(); }; });
}

/* ---------- Start ---------- */
(function init() {
  var inv = location.hash.indexOf("join=") >= 0 ? parseInvite(location.hash) : null;
  if (inv) { try { history.replaceState(null, "", location.pathname); } catch (e) {} if (!cfg.me || cfg.code !== inv.c) { startJoin(inv); } }
  else if (!cfg.me) showSetup();
  show("heute");
  connect(); flush();
  checkNewVersion(); setTimeout(checkRemoteUpdate, 4000);
  setInterval(function () { if (tab === "heute") renderHeute(); }, 60000);
  if ("serviceWorker" in navigator && location.protocol === "https:") { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {} }
})();
</script>
</body>
